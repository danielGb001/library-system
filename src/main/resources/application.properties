# Application name (just a label, shows up in logs)
spring.application.name=library-system

# Database connection details
spring.datasource.url=jdbc:mysql://localhost:3306/library_system?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=libraryUser
# Password comes from config/application.properties (git-ignored), see README
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate settings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# Flyway: the schema is managed by the migrations in db/migration.
# baseline-on-migrate lets Flyway adopt an existing database (tables but no history) as version 1.
spring.flyway.baseline-on-migrate=true
